[package]
name = "boxbox-gpui"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experiment: the BoxBox desktop browse UI rebuilt with GPUI"

[dependencies]
anyhow = "1"
async-channel = "2"
boxbox-thumbnail = { version = "0.1.0", path = "../../desktop/native" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
gpui = "0.2.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
libc = "=0.2.189"
log = "0.4"
material-colors = "0.4.2"
md-5 = "0.10.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"
ureq = { version = "2", features = ["json"] }
wl-clipboard-rs = "0.9"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb = "0.13"
yeslogic-fontconfig-sys = "6.0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
