[package]
name = "boxbox-gpui"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experiment: the BoxBox desktop browse UI rebuilt with GPUI"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
