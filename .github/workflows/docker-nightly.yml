name: Publish Nightly Docker Image

on:
  schedule:
    # 02:00 Asia/Kolkata (GitHub schedules use UTC).
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: docker-nightly
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    name: Publish nightly image
    runs-on: ubuntu-latest

    steps:
      - name: Check for changes since the last nightly
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"

          # Manual runs always rebuild. Scheduled runs skip an unchanged commit.
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 0
          fi

          response="$(curl --fail --silent --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-nightly.yml/runs?status=success&per_page=1")"
          previous_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<< "$response")"

          if [[ "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changes on master since the last successful nightly."
          fi

      - name: Checkout
        if: steps.nightly.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: steps.nightly.outputs.publish == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: steps.nightly.outputs.publish == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: steps.nightly.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare dedicated nightly image name
        if: steps.nightly.outputs.publish == 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/boxbox-nightly" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        if: steps.nightly.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push nightly image
        if: steps.nightly.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nightly
          cache-to: type=gha,mode=max,scope=nightly
