name: Publish desktop AppImages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build AppImages for
        required: true
        type: string
        default: v0.3.2

permissions:
  contents: read

concurrency:
  group: appimages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-24.04-arm
            tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Checkout packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Set up source dependencies
        uses: ./.github/actions/setup-desktop
      - name: Install package verification tools
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils librsvg2-bin
          curl --fail --location --retry 3 "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          echo "$TOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl --fail --location --retry 3 "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH}" -o "$RUNNER_TEMP/appimage-runtime"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime" | sha256sum --check
        env:
          ARCH: ${{ matrix.arch }}
          TOOL_SHA256: ${{ matrix.tool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
      - name: Build native desktop
        run: bun run build:desktop
      - name: Package AppImage
        run: bun tooling/scripts/package-appimage.ts
        env:
          BOXBOX_SOURCE_ROOT: ${{ github.workspace }}
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME: ${{ runner.temp }}/appimage-runtime
      - name: Verify actual AppImage runtime
        working-directory: dist/appimages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sha256sum --check ./*.sha256
          image="$PWD/boxbox-desktop-${RELEASE_TAG}-${ARCH}.AppImage"
          "$image" --appimage-extract
          desktop-file-validate squashfs-root/io.boxbox.desktop
          # Also test FUSE-free startup, renderer settings, handoff and shutdown.
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bun "$GITHUB_WORKSPACE/tooling/desktop/scripts/native-smoke.ts" "$image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/appimages/*.AppImage
            dist/appimages/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach both AppImages to release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: appimage-*
          merge-multiple: true
          path: release
      - name: Publish verified downloads
        working-directory: release
        run: |
          sha256sum --check ./*.sha256
          gh release view "$RELEASE_TAG"
          # Do not overwrite existing published assets on a retry.
          gh release upload "$RELEASE_TAG" ./*.AppImage ./*.sha256
